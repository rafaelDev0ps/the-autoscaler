syntax = "proto3";

option go_package = "the-autoscaler/project";
option java_multiple_files = true;
option java_package = "io.grpc.the-autoscaler";
option java_outer_classname = "TheAutoscalerProto";

package theautoscaler;

// The greeting service definition.
service TheAutocaler {
  // Sends a greeting
  rpc CheckResourcesUsage (CheckRequest) returns (CheckReply) {}
}

// The request message containing the container ID.
message CheckReply {}

// The response message containing the greetings
message CheckRequest {
  double cpuPercent = 1;
  double memoryPercent = 2;
  string containerId = 3;
}
